<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 1. Swap to the bulletproof qrcode.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    .qr-container { background: white; padding: 15px; border-radius: var(--border-radius); border: 1px solid #d1d5db; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; }
    .btn-danger { background-color: #ef4444; }
    .btn-danger:hover { background-color: #dc2626; }
    .counter-badge { font-size: 1.25rem; font-weight: 700; color: var(--primary-color); margin: 15px 0; padding: 10px; background: #e0e7ff; border-radius: var(--border-radius); }
  </style>
</head>
<body>
  <div class="card" style="max-width: 500px;">
    <h1>Class Attendance QR</h1>
    
    <div id="startSection">
      <input id="courseCode" placeholder="Course code (e.g., CS201)" />
      <button id="startBtn">Start Session</button>
    </div>
    
    <div id="qrSection" style="display:none;">
      <p style="margin-bottom: 15px; color: var(--text-main);">Project this code. It updates every 6 seconds.</p>
      
      <div class="counter-badge">
        Successful Scans: <span id="scanCount">0</span>
      </div>

      <div class="qr-container">
        <div id="qrBox"></div> 
      </div>
      
      <!-- New Live Dashboard UI -->
      <div id="attendanceList" style="margin-bottom: 20px; text-align: left; max-height: 180px; overflow-y: auto; background: white; padding: 15px; border-radius: var(--border-radius); border: 1px solid #d1d5db;">
         <h3 style="font-size: 1rem; margin-bottom: 10px; color: var(--text-main);">Live Roster</h3>
         <ul id="scanList" style="list-style: none; padding: 0; font-size: 0.9rem; color: var(--text-muted);">
            <li>No scans yet.</li>
         </ul>
      </div>

      <p id="qrStatus"></p>
      <button id="endBtn" class="btn-danger">End Session</button>
    </div>
  </div>
  <script src="teacher.js"></script>
</body>
